[project]
name = "techbuddy"
version = "0.1.0"
description = "An AI-powered chatbot built with Streamlit"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.67.0",
    "python-dotenv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]